name: Web CI Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Stage 1: Test & Quality Gate (gọi qua CI tập trung)
  # ===========================================================================
  test:
    name: "Stage: Test"
    uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/verify-node.yml@main

  # ===========================================================================
  # Stage 2: Dockerize & Push Image (chỉ chạy khi push/merge vào main hoặc staging)
  # ===========================================================================
  dockerize:
    name: "Stage: Dockerize & Push"
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-node.yml@main
    with:
      service_name: delivery-web
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
