name: Web CI Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Stage 1: Test & Quality Gate (chạy trên cả PR và Push)
  # ===========================================================================
  test:
    name: "Stage: Test"
    uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/verify-node.yml@main

  # ===========================================================================
  # Stage 2: Dockerize & Push (chỉ chạy khi push/merge vào main hoặc staging)
  # Khai báo image_name, dockerfile và target platform trực tiếp tại đây
  # ===========================================================================
  dockerize:
    name: "Stage: Dockerize & Push"
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-node.yml@main
    with:
      image_name: "delivery-web"
      dockerfile: "./Dockerfile"
      platform: "linux/amd64"
    secrets: inherit
