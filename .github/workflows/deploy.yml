name: CI - Build & Push Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ===========================================================================
# Gọi CI tập trung để build Docker image + push GAR.
# ArgoCD Image Updater sẽ tự phát hiện tag mới → cập nhật gitops-cd → deploy.
# ===========================================================================
jobs:
  build:
    name: "Build delivery-web"
    uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-node.yml@main
    with:
      service_name: delivery-web
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
